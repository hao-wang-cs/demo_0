<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Orbit — TensorX Chat</title><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/><link rel="stylesheet" href="/styles.css"/></head>
<body><main class="shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">✦</span><span>orbit</span></div><button class="new-chat" id="newChat"><span>＋</span> New conversation</button><div class="side-label">Workspace</div><nav><button class="nav-item active"><span>◈</span> Chat</button><button class="nav-item" id="clearChat"><span>⌁</span> Clear history</button></nav><div class="sidebar-foot"><div class="status-dot"></div><div><b>TensorX connected</b><small>Private session</small></div></div></aside><section class="chat-panel"><header class="topbar"><div><div class="eyebrow">PERSONAL AI WORKSPACE</div><h1>Good to see you.</h1></div><div class="model-pill"><span class="pulse"></span><span id="modelName">Llama 3.1 8B</span><span class="chevron">⌄</span></div></header><div class="conversation" id="conversation"><div class="welcome" id="welcome"><div class="orb">✦</div><p class="welcome-kicker">TENSORX INTELLIGENCE</p><h2>What’s on your mind?</h2><p class="welcome-copy">Ask anything. Orbit keeps the conversation focused, fast, and yours.</p><div class="suggestions"><button data-prompt="Help me plan my week with focus and balance.">Plan my week <span>↗</span></button><button data-prompt="Explain a complex idea in a simple, intuitive way.">Explain something <span>↗</span></button><button data-prompt="Give me three creative ideas for a weekend project.">Spark an idea <span>↗</span></button></div></div></div><div class="composer-wrap"><form class="composer" id="composer"><textarea id="message" rows="1" placeholder="Message Orbit…" aria-label="Message"></textarea><button class="send" type="submit" aria-label="Send message">↑</button></form><div class="composer-note"><span>↵ Enter to send&nbsp; · &nbsp;Shift + Enter for new line</span><span>Powered by TensorX</span></div></div></section></main><script src="/app.js"></script></body></html>
